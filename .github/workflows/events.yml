
name: Push and Pull Request Events

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  show-event:
    runs-on: ubuntu-latest
    steps:
      - name: Display event details
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Actor: ${{ github.actor }}"
