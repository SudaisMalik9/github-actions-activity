
name: Scheduled Cron Test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scheduled-test:
    runs-on: ubuntu-latest
    steps:
      - name: Show schedule execution
        run: |
          echo "Scheduled workflow executed."
          echo "Event: ${{ github.event_name }}"
          date -u
