
name: Module 4 - Variables and Secrets

on:
  workflow_dispatch:

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Show repository variable
        env:
          ACTIVITY_LABEL: ${{ vars.ACTIVITY_LABEL }}
        run: |
          echo "Activity label: $ACTIVITY_LABEL"

      - name: Verify secret is masked
        env:
          MY_SECRET: ${{ secrets.MY_SECRET }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "ERROR: MY_SECRET is missing"
            exit 1
          fi
          echo "Secret is configured; value follows:"
          echo "$MY_SECRET"

      - name: Verify built-in GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: GITHUB_TOKEN is missing"
            exit 1
          fi
          echo "GITHUB_TOKEN is available."
          gh api /user --silent || echo "Token exists; API call needs additional permission or authentication context."
