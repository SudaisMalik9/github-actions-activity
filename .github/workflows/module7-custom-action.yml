
name: Module 7 - Custom JavaScript Action

on:
  workflow_dispatch:

jobs:
  run-custom-action:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout activity repository
        uses: actions/checkout@v4

      - name: Run Hello Custom Action
        id: greeting
        uses: SudaisMalik9/hello-custom-action@v1.0.0
        with:
          who-to-greet: 'Sudais'

      - name: Display action output
        run: echo "Greeting time: ${{ steps.greeting.outputs.time }}"
